<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steindamm 99</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#151515;color:#f7f3eb;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:30px 18px}h1{font-size:30px}button,textarea{font:inherit}button{cursor:pointer;background:#302b26;color:white;border:1px solid #5c4a39;border-radius:14px;padding:16px;text-align:left;width:100%;margin:8px 0}button:disabled{opacity:.45}textarea{box-sizing:border-box;width:100%;min-height:100px;background:#272727;color:white;padding:12px;border:1px solid #555;border-radius:12px}.muted{color:#b7afa3}#review{display:none}#stars button{width:18%;text-align:center;padding:12px 0}.selected{background:#7d5730}</style></head>
<body><main><h1>Steindamm 99</h1><p class="muted" id="hello">Добро пожаловать!</p>
<section id="home"><button disabled>📅 Забронировать столик — скоро</button><button onclick="showReview()">⭐ Как прошёл ваш визит?</button></section>
<section id="review"><button onclick="back()">← Назад</button><h2>Как прошёл ваш визит?</h2><p>Оцените посещение</p><div id="stars"></div><p>Комментарий</p><textarea id="comment" placeholder="Расскажите о вашем визите"></textarea><button onclick="sendReview()">Отправить отзыв</button></section><p id="status" class="muted"></p></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const initData=tg?.initData||"";let rating=0;
function showReview(){document.getElementById("home").style.display="none";document.getElementById("review").style.display="block"}
function back(){document.getElementById("home").style.display="block";document.getElementById("review").style.display="none"}
function draw(){document.getElementById("stars").innerHTML=[1,2,3,4,5].map(n=>'<button class="'+(n<=rating?'selected':'')+'" onclick="rate('+n+')">★</button>').join("")}
function rate(n){rating=n;draw()}draw();
async function request(path,data){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData,...data})});const j=await r.json();if(!r.ok)throw Error(j.detail||"Ошибка");return j}
async function sendReview(){if(!rating){document.getElementById("status").textContent="Выберите оценку";return}try{const r=await request("/api/review",{stars:rating,comment:document.getElementById("comment").value});document.getElementById("status").textContent=r.preview?"Тестовый отзыв: отправка работает":"Спасибо за отзыв!";back()}catch(e){document.getElementById("status").textContent=e.message}}
request("/api/me",{}).then(p=>{document.getElementById("hello").textContent="Здравствуйте, "+p.name+"!"}).catch(e=>{document.getElementById("status").textContent=e.message})
</script></body></html>
